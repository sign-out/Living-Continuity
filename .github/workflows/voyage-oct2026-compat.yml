name: LC Voyage October 2026 static contract

on:
  pull_request:
    paths:
      - Living_Continuity.json
      - tests/test_voyage_oct2026_contract.py
      - .github/workflows/voyage-oct2026-compat.yml

permissions:
  contents: read

jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate LC V37 compatibility contracts and unchanged native state
        run: python -m unittest discover -s tests -p 'test_voyage_oct2026_contract.py' -v
